# electron-builder 打包配置：NSIS 安装包 + 便携版，注册 .md 等文件关联
appId: com.mdforge.editor
productName: MDForge
copyright: Copyright © 2026 MDForge
directories:
  output: dist
  buildResources: build
# 直接用已安装的 Electron 解包目录，省去下载（版本与本机一致，最稳）
electronDist: node_modules/electron/dist
# 只保留中英语言包，其余 40 多个 locales 不打包
electronLanguages:
  - zh-CN
  - en-US
files:
  - out/**
# 注意：主进程会把 dependencies 里的包当外部依赖（out/main 里是 require("…")），
# 这些包由 electron-builder 自动拷进 asar，不能排除 node_modules。
# 只被渲染进程用到的库（katex / mermaid / remark-math 等）请留在 devDependencies——
# 它们已由 electron-vite 打进 out/renderer，放进 dependencies 会让整棵依赖树
# （mermaid 一棵就一百多 MB）被拷进 asar，安装包白涨近 40 MB。
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
fileAssociations:
  - ext:
      - md
      - markdown
      - mdown
      - mkd
    name: Markdown 文档
    description: Markdown 文档
    role: Editor
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MDForge
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
# 自动更新：app-update.yml 写进包内，更新元数据 latest.yml 随安装包一起发布
publish:
  provider: github
  owner: Zxin1026
  repo: mdforge-editor
